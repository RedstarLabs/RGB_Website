[project]
name = "rgb-website"
version = "0.1.0"
description = "Datensparsame Forschungsanwendung zur Zuordnung von Farben und Emotionen"
readme = "README.md"
authors = [
    { name = "RedstarLabs", email = "337061297+RedstarLabs@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
